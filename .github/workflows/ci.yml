name: CI - Research copilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual test run from the Actions tab

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .
        continue-on-error: true
        # continue-on-error: true while the codebase is being annotated
        # incrementally. Remove this line once mypy passes cleanly with
        # zero errors, so future regressions actually fail the build.

      - name: Pytest
        run: uv run pytest tests/ -v --junitxml=report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: report.xml
          retention-days: 7

  build-and-push:
    name: Build and push Docker images
    needs: quality
    # Only on a real push to main, from a merged PR or otherwise,
    # never on a PR itself (a PR from a fork would not even have
    # access to the Docker Hub secrets).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: api/Dockerfile
            # The api image builds FROM the manually-built,
            # model-baked base image, never rebuilding or
            # re-downloading it here. See api/Dockerfile.base.
            build-args: |
              BASE_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/research-copilot-api-base:latest
          - service: frontend
            dockerfile: frontend/Dockerfile
            build-args: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/research-copilot-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/research-copilot-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/research-copilot-${{ matrix.service }}:buildcache,mode=max
